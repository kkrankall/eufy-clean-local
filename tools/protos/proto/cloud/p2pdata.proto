        stream.RestrictedZone restricted_zones = 11;
        stream.RoomParams room_params = 12;
        stream.CruiseData cruise_data = 13;
        stream.TemporaryData temporary_data = 14;
    }
    uint32 is_new_map = 15;
    string name = 16;
}

message CompleteMap {
