syntax = "proto3";

package proto.cloud;

message Empty {
}

message Point {
    sint32 x = 1;
    sint32 y = 2;
}

message Pose {
    sint32 x = 1;
    sint32 y = 2;
    sint32 theta = 3;
}

message Line {
    Point p0 = 1;
    Point p1 = 2;
}

message Quadrangle {
    Point p0 = 1;
    Point p1 = 2;
    Point p2 = 3;
    Point p3 = 4;
}

message Polygon {
    repeated Point points = 1;
}

message Switch {
    bool value = 1;
}

message Active {
    bool value = 1;
}

message Numerical {
    uint32 value = 1;
}

message Floor {
    enum Type {
        UNKNOW = 0;
        BLANKET = 1;
        WOOD = 2;
        CERAMIC = 3;
        MARBLE = 4;  // iOS-only
        GRAVEL = 5;  // iOS-only
    }
    Type type = 1;
}

message RoomScene {
    enum Type {
        UNKNOW = 0;
        STUDYROOM = 1;
        BEDROOM = 2;
        RESTROOM = 3;
        KITCHEN = 4;
        LIVINGROOM = 5;
        DININGROOM = 6;
        CORRIDOR = 7;
        GUESTROOM = 8;  // iOS-only
        POWDERROOM = 9;  // iOS-only
    }
    message Index {
        uint32 value = 1;
    }
    Type type = 1;
    Index index = 2;
}
